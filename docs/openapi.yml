    post:
      tags:
        - Users
      summary: Reset user password (superuser only)
      description: |
        Reset a user's password. Only superusers can access this endpoint.
        Supports both custom password reset and default password reset functionality.
        The frontend provides a "Change to Default Password" button for superusers
        that resets the password to 'password123' with proper safety confirmations.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
          description: ID of the user whose password will be reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password: 
                  type: string
                  description: New password for the user (use 'password123' for default password reset)
                  example: "password123"
                send_email:
                  type: boolean
                  description: Whether to send password reset email (optional, defaults to false)
                  default: false
              required: [new_password]
      responses:
        '200': 
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '403': 
          description: Forbidden - Only superusers can reset passwords
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        '404': 
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

