  # =============================================================================
  # EXTERNAL AUTH ENDPOINTS (Token-based)
  # =============================================================================

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (external)
      description: JSON registration that creates a pending account (is_active=false, verified=false)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string, nullable: true }
                first_name: { type: string, nullable: true }
                last_name: { type: string, nullable: true }
              required: [username, password]
            examples:
              sample:
                summary: Basic registration
                value:
                  username: demo_user
                  password: demopass123
                  email: demo@example.com
                  first_name: Demo
                  last_name: User
      responses:
        '201':
          description: Registration successful; account pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user_id: { type: integer }
                  status: { type: string, example: pending_approval }
                example:
                  message: Registration successful. Account pending approval.
                  user_id: 123
                  status: pending_approval
        '400': { description: Validation error }
        '409': { description: Username or email already exists }
      x-codeSamples:
        - lang: cURL
          label: Register
          source: |
            curl -X POST "http://localhost:5000/api/auth/register" \
              -H "Content-Type: application/json" \
              -d '{
                "username": "demo_user",
                "password": "demopass123",
                "email": "demo@example.com"
              }'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (external)
      description: Returns access and refresh tokens for bearer authentication. Supports both username and email login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, description: "Username or email address" }
                password: { type: string }
              required: [username, password]
            examples:
              username_login:
                summary: Login with username
                value:
                  username: demo_user
                  password: demopass123
              email_login:
                summary: Login with email
                value:
                  username: demo@example.com
                  password: demopass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, example: 3600 }
                  user:
                    type: object
                example:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 123
                    username: demo_user
                    role: GENERAL
                    is_premium: false
                    verified: true
        '401': { description: Invalid credentials }
        '403': { description: Account pending or suspended }
      x-codeSamples:
        - lang: cURL
          label: Login
          source: |
            curl -X POST "http://localhost:5000/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{
                "username": "demo_user",
                "password": "demopass123"
              }'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
            examples:
              sample:
                summary: Refresh payload
                value:
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, example: 3600 }
                example:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: bearer
                  expires_in: 3600
        '401': { description: Invalid or expired refresh token }
      x-codeSamples:
        - lang: cURL
          label: Refresh tokens
          source: |
            curl -X POST "http://localhost:5000/api/auth/refresh" \
              -H "Content-Type: application/json" \
              -d '{
                "refresh_token": "<REFRESH_TOKEN>"
              }'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (stateless)
      description: Clients should discard tokens; server returns success
      responses:
        '200': { description: Logged out }
      x-codeSamples:
        - lang: cURL
          label: Logout
          source: |
            curl -X POST "http://localhost:5000/api/auth/logout"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user (external bearer)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  username: { type: string }
                  email: { type: string, nullable: true }
                  role: { type: string, nullable: true }
                  is_premium: { type: boolean }
                  verified: { type: boolean }
                  last_login: { type: string, format: date-time, nullable: true }
                example:
                  id: 123
                  username: demo_user
                  email: demo@example.com
                  role: GENERAL
                  is_premium: false
                  verified: true
                  last_login: 2025-09-05T14:41:00Z
        '401': { description: Unauthorized }
      x-codeSamples:
        - lang: cURL
          label: Get current user
          source: |
            curl "http://localhost:5000/api/auth/me" \
              -H "Authorization: Bearer <ACCESS_TOKEN>"

