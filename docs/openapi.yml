openapi: 3.0.3
info:
  title: LilyOpenCMS API
  description: |
    A comprehensive API for LilyOpenCMS content management system.
    
    ## Features
    - **Content Management**: News, albums, chapters, and media
    - **User Management**: Profiles, authentication, and permissions
    - **Public API**: Multiplatform access for mobile apps and third-party integrations
    - **Safe Image Handling**: Automatic fallback to placeholder images for missing album covers
    - **SEO Management**: Comprehensive SEO tools and analytics
    - **Analytics**: Performance monitoring and user statistics
    
    ## Authentication
    Most endpoints require authentication via session cookies or JWT tokens.
    Public API endpoints (`/api/public/*`) do not require authentication.
    
    ## Rate Limiting
    API endpoints are rate-limited to prevent abuse. Please implement appropriate retry logic.
    
    ## Support
    For API support, please refer to the documentation or contact the development team.
  version: 1.0.0
  contact:
    name: LilyOpenCMS Development Team
    email: support@lilyopencms.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "{scheme}://{host}"
    description: Custom server (set scheme/host below to try any deployment)
    variables:
      scheme:
        enum:
          - http
          - https
        default: https
      host:
        default: localhost:5000
        description: Hostname and optional port (e.g., api.example.com or localhost:5000)
  - url: http://localhost:5000
    description: Development server
  - url: https://api.lilyopencms.com
    description: Production server

tags:
  - name: Public API
    description: Public endpoints for multiplatform access (no authentication required)
  - name: Xlate
    description: Read-only translation-layer endpoints used for app development
  - name: News
    description: News articles and stories management
  - name: Albums
    description: Album and chapter management
  - name: User Albums
    description: User-facing album management with tab structure and consistent styling
  - name: Users
    description: User management and authentication
  - name: Auth
    description: External authentication endpoints for mobile and third-party apps
  - name: Comments
    description: Comment system and moderation
  - name: Ratings
    description: Rating system and analytics
  - name: Categories
    description: Category and tag management
  - name: SEO
    description: SEO management and analytics
  - name: Media
    description: Image and video management
  - name: Analytics
    description: System analytics and performance monitoring
  - name: Ads
    description: Advertisement management and serving system

paths:
  # NOTE: Removed duplicate simple endpoints to avoid path key collisions with authenticated endpoints.

  # =============================================================================
  # JWT AUTHENTICATED API ENDPOINTS (for mobile/external apps)
  # =============================================================================

  /api/auth/comments/{type}/{id}:
    get:
      summary: Get comments for content (JWT auth)
      description: Get comments for news or album content with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [news, album]
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: include_replies
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
                      has_next:
                        type: boolean
                      has_prev:
                        type: boolean
        '401':
          description: Authentication required
        '403':
          description: Account inactive or suspended
        '400':
          description: Invalid content type
    post:
      summary: Create comment (JWT auth)
      description: Create a new comment for news or album content with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [news, album]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 5000
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                parent_comment_id:
                  type: integer
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  comment:
                    $ref: '#/components/schemas/Comment'
        '401':
          description: Authentication required
        '403':
          description: Account inactive or suspended
        '400':
          description: Validation error

  /api/auth/comments/{type}/{id}/rate:
    post:
      summary: Create/update rating (JWT auth)
      description: Create or update rating for news or album content with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [news, album]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        '200':
          description: Rating updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '201':
          description: Rating created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Account inactive or suspended
        '400':
          description: Invalid rating value

  /api/auth/library:
    get:
      summary: Get user library (JWT auth)
      description: Get user's saved library items with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: type
          in: query
          schema:
            type: string
            enum: [news, album, all]
      responses:
        '200':
          description: Library items retrieved successfully
        '401':
          description: Authentication required
    post:
      summary: Add to library (JWT auth)
      description: Add content to user's library with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
                - content_id
              properties:
                content_type:
                  type: string
                  enum: [news, album]
                content_id:
                  type: integer
      responses:
        '200':
          description: Item added to library successfully
        '401':
          description: Authentication required
    delete:
      summary: Remove from library (JWT auth)
      description: Remove content from user's library with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
                - content_id
              properties:
                content_type:
                  type: string
                  enum: [news, album]
                content_id:
                  type: integer
      responses:
        '200':
          description: Item removed from library successfully
        '401':
          description: Authentication required

  /api/auth/library/check:
    get:
      summary: Check library status (JWT auth)
      description: Check if content is in user's library with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      parameters:
        - name: content_type
          in: query
          required: true
          schema:
            type: string
            enum: [news, album]
        - name: content_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Library status retrieved successfully
        '401':
          description: Authentication required

  /api/auth/me:
    get:
      summary: Get current user (JWT auth)
      description: Get current user information with JWT authentication for mobile apps
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
        '401':
          description: Authentication required

  # =============================================================================
  # PUBLIC API ENDPOINTS (with "public" prefix)
  # =============================================================================
  
  /api/public/news/{news_id}:
    get:
      tags:
        - Public API
      summary: Get single news article details
      description: |
        Retrieve detailed information for a specific news article with rich data enrichment.
        This endpoint provides JSON equivalents for resources previously only available as HTML pages.
      parameters:
        - name: news_id
          in: path
          required: true
          description: The unique identifier of the news article
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response with news article details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNewsResponse'
        '404':
          description: News article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/news:
    get:
      tags:
        - Public API
      summary: Get list of news articles
      description: |
        Retrieve a paginated list of news articles with filtering, search, and sorting options.
        Supports advanced filtering by category, search queries, and multiple sorting options.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CategoryIdParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortNewsParam'
      responses:
        '200':
          description: Successful response with news list and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNewsListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/albums/{album_id}:
    get:
      tags:
        - Public API
      summary: Get single album details
      description: |
        Retrieve detailed information for a specific album with chapters and metadata.
        Includes rich data enrichment with related content and user information.
      parameters:
        - name: album_id
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response with album details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAlbumResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/albums:
    get:
      tags:
        - Public API
      summary: Get list of albums
      description: |
        Retrieve a paginated list of albums with filtering and sorting options.
        Supports filtering by category, search queries, and multiple sorting options.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CategoryIdParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/SortAlbumsParam'
      responses:
        '200':
          description: Successful response with albums list and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAlbumsListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/albums/{album_id}/chapters/{chapter_id}:
    get:
      tags:
        - Public API
      summary: Get single album chapter details
      description: |
        Retrieve detailed information for a specific chapter within an album.
        Includes navigation information for next/previous chapters.
      parameters:
        - name: album_id
          in: path
          required: true
          description: The unique identifier of the parent album
          schema:
            type: integer
            minimum: 1
        - name: chapter_id
          in: path
          required: true
          description: The unique identifier of the chapter
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response with chapter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicChapterResponse'
        '404':
          description: Chapter or album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/user/{username}:
    get:
      tags:
        - Public API
      summary: Get public user profile information
      description: |
        Retrieve public profile information for a specific user.
        Includes basic profile data, social links, and activity information.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: Successful response with user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfileResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/user/{username}/stats:
    get:
      tags:
        - Public API
      summary: Get user statistics
      description: |
        Retrieve public statistics for a specific user.
        Includes content creation metrics and performance data.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: Successful response with user statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserStatsResponse'
        '404':
          description: User or statistics not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/user/{username}/library:
    get:
      tags:
        - Public API
      summary: Get user's public library
      description: |
        Retrieve public library items for a specific user.
        Includes favorited content and reading history.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: Successful response with user library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserLibraryResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =============================
  # PUBLIC USER PROFILE PAGES
  # =============================

  /profile/{username}:
    get:
      tags:
        - Public Pages
      summary: Public user profile page
      description: |
        Main public user profile page with overview, stats, and recent content.
        Similar to social media profile pages with comprehensive user information.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: User profile page rendered
          content:
            text/html:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/html:
              schema:
                type: string

  /profile/{username}/stats:
    get:
      tags:
        - Public Pages
      summary: User statistics page
      description: |
        Detailed user statistics page with charts and analytics.
        Shows comprehensive metrics including content creation, engagement, and performance.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: User statistics page rendered
          content:
            text/html:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/html:
              schema:
                type: string

  /profile/{username}/content:
    get:
      tags:
        - Public Pages
      summary: User content browsing page
      description: |
        Paginated browsing of user's stories and albums.
        Includes filtering and search functionality for content discovery.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 12
        - name: type
          in: query
          required: false
          description: Content type filter (stories, albums, all)
          schema:
            type: string
            enum: [stories, albums, all]
            default: all
      responses:
        '200':
          description: User content page rendered
          content:
            text/html:
              schema:
                type: string
        '404':
          description: User not found
          content:
            text/html:
              schema:
                type: string

  /api/profile/{username}/follow:
    post:
      tags:
        - Public API
      summary: Follow/unfollow a user
      description: |
        Follow or unfollow a user. Requires authentication.
        Returns updated follow status and counts.
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user to follow/unfollow
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [follow, unfollow]
                  description: Action to perform
      responses:
        '200':
          description: Follow action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  following:
                    type: boolean
                    description: Current follow status
                  followers_count:
                    type: integer
                    description: Updated followers count
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/{username}/stats:
    get:
      tags:
        - Public API
      summary: Get user statistics data
      description: |
        API endpoint for user statistics data.
        Returns comprehensive user metrics and performance data.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
      responses:
        '200':
          description: User statistics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/{username}/content:
    get:
      tags:
        - Public API
      summary: Get user content (stories/albums)
      description: |
        API endpoint for user content (stories/albums) with search, filtering, and pagination.
        Returns paginated content with 9 items per page.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the user
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: search
          in: query
          required: false
          description: Search term for filtering content
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Category ID for filtering
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for content
          schema:
            type: string
            enum: [newest, oldest, popular, least-popular, most-viewed, least-viewed, highest-rated]
            default: newest
        - name: status
          in: query
          required: false
          description: Status filter for albums (ongoing, completed, hiatus)
          schema:
            type: string
            enum: [ongoing, completed, hiatus]
        - name: tab
          in: query
          required: false
          description: Content type tab (stories or albums)
          schema:
            type: string
            enum: [stories, albums]
            default: stories
      responses:
        '200':
          description: User content data with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User profile is private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/categories:
    get:
      tags:
        - Public API
      summary: Get list of active categories
      description: |
        Retrieve a list of all active categories with content counts.
        Useful for building navigation and filtering interfaces.
      responses:
        '200':
          description: Successful response with categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoriesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/tags:
    get:
      tags:
        - Public API
      summary: Get list of tags
      description: |
        Retrieve a list of all tags with optional search filtering.
        Includes content counts for news and albums.
      parameters:
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Successful response with tags list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTagsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/comments/{content_type}/{content_id}:
    get:
      tags:
        - Public API
      summary: Get comments for content
      description: |
        Retrieve a paginated list of top-level comments for specific content.
        Supports pagination and includes reply counts.
      parameters:
        - $ref: '#/components/parameters/ContentTypeParamPublic'
        - name: content_id
          in: path
          required: true
          description: The ID of the content item
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response with comments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentsResponse'
        '400':
          description: Invalid content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/comments/{comment_id}/replies:
    get:
      tags:
        - Public API
      summary: Get comment replies
      description: |
        Retrieve a paginated list of replies for a specific parent comment.
        Supports pagination and chronological ordering.
      parameters:
        - name: comment_id
          in: path
          required: true
          description: The ID of the parent comment
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response with replies list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentRepliesResponse'
        '404':
          description: Parent comment not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
