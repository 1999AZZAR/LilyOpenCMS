  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchParam:
      name: search
      in: query
      description: Search query string
      schema:
        type: string
    SortNewsParam:
      name: sort
      in: query
      description: Sorting order for news endpoints
      schema:
        type: string
        enum: [latest, popular, newest, oldest, relevance]
        default: latest
    SortAlbumsParam:
      name: sort
      in: query
      description: Sorting order for albums endpoints
      schema:
        type: string
        enum: [latest, popular, chapters, newest, oldest, most-viewed, least-viewed, highest-rated]
        default: latest
    SortNewsAdvancedParam:
      name: sort
      in: query
      description: Sorting order for news endpoints
      schema:
        type: string
        enum: [newest, oldest, popular, least-popular, latest, relevance]
        default: newest
    CategoryIdParam:
      name: category
      in: query
      description: Filter by category ID
      schema:
        type: integer
    ContentTypeParamPublic:
      name: content_type
      in: path
      required: true
      description: Content type identifier
      schema:
        type: string
        enum: [news, album, album_chapter, chapter]
    HomeDesignParam:
      name: design
      in: query
      description: Homepage design variant to return
      schema:
        type: string
        enum: [news, albums]
        default: news
    VisibilityParam:
      name: visibility
      in: query
      description: Filter by visibility (visible/hidden)
      schema:
        type: string
        enum: [visible, hidden]
    AllUsersParam:
      name: all_users
      in: query
      description: Apply ownership-based access filtering for images
      schema:
        type: boolean
    RoleParam:
      name: role
      in: query
      description: Filter users by role
      schema:
        type: string
    StatusParam:
      name: status
      in: query
      description: Filter users by status
      schema:
        type: string
    VerifiedParam:
      name: verified
      in: query
      description: Filter users by verification state
      schema:
        type: boolean
    GroupedParam:
      name: grouped
      in: query
      description: Return categories grouped by group
      schema:
        type: boolean

  requestBodies:
    CommentCreateBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              content_type:
                type: string
                enum: [news, album, album_chapter]
              content_id:
                type: integer
              content:
                type: string
              parent_id:
                type: integer
                nullable: true
            required: [content_type, content_id, content]
    RatingUpsertBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              content_type:
                type: string
                enum: [news, album]
              content_id:
                type: integer
              rating:
                type: integer
                minimum: 1
                maximum: 5
            required: [content_type, content_id, rating]

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session-based authentication via cookies
    
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication
    
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for external ad access and third-party integrations

security:
  - sessionAuth: []
  - bearerAuth: []