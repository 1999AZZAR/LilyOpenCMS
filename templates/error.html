<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_info.brand_name|default('LilyOpenCMS') }} - Error {{ code }}</title>
    
    <!-- Core Meta Tags -->
    <meta name="description" content="Error page - {{ brand_info.tagline|default('Modern content management for the digital age') }}">
    <meta name="keywords" content="{{ brand_info.brand_name|default('LilyOpenCMS') }}, error, 404, 500">
    <meta name="author" content="{{ brand_info.brand_name|default('LilyOpenCMS') }}">
    <meta name="language" content="id">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pic/favicon.png') }}">

    <!-- Stylesheets -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_css.css') }}">
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              border: 'hsl(var(--border))', input: 'hsl(var(--input))', ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))',
              primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
              secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
              destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
              muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
              accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
              popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
              card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
            },
            borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
            fontSize: { base: ['15px', '1.6'] }
          },
        }, 
        plugins: [],
      }
    </script>
</head>
<body class="bg-background text-foreground antialiased flex flex-col min-h-screen" style="background-image: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 50%), radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);">
  <!-- Error Content -->
  <main class="flex justify-center items-center min-h-screen px-4 sm:px-6 py-16 lg:py-24" role="alert" aria-live="assertive">
    <div class="w-full max-w-4xl bg-white border border-gray-200 shadow-lg rounded-2xl p-16 text-center" role="alertdialog" aria-labelledby="error-title" aria-describedby="error-description">
      

      <div class="mb-12 text-primary" aria-hidden="true">
        {% if code == 404 %}
           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-32 h-32 mx-auto opacity-60">
             <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
           </svg>
        {% elif code == 403 %}
           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-32 h-32 mx-auto opacity-60">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
           </svg>
        {% else %}
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-32 h-32 mx-auto opacity-60">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z" />
          </svg>
        {% endif %}
      </div>

      <h1 id="error-title" class="text-8xl lg:text-9xl font-bold text-gray-900 mb-8" role="heading" aria-level="1">
        {{ code }}
      </h1>

      <p id="error-description" class="text-3xl lg:text-4xl font-semibold text-gray-700 mb-8">
        {{ message }}
      </p>
      <p class="text-xl text-gray-500 mb-12 max-w-2xl mx-auto leading-relaxed" aria-live="polite">
         Maaf, terjadi kesalahan. Silakan coba lagi nanti atau kembali ke beranda.
       </p>

      <div class="flex flex-col sm:flex-row gap-6 justify-center items-center max-w-lg mx-auto">
        <a href="{{ url_for('main.home') }}" class="w-full sm:w-auto bg-gradient-to-r from-yellow-400 to-yellow-500 text-gray-900 py-4 px-10 rounded-full font-semibold flex items-center justify-center gap-3 hover:from-yellow-500 hover:to-yellow-600 focus:outline-none focus:ring-4 focus:ring-yellow-300/50 transition-all duration-300 text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1" aria-label="Kembali ke Beranda">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6" aria-hidden="true">
             <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h7.5" />
          </svg>
          Kembali ke Beranda
        </a>
        <button onclick="history.back()" class="w-full sm:w-auto bg-gradient-to-r from-gray-100 to-gray-200 text-gray-700 py-4 px-10 rounded-full font-semibold flex items-center justify-center gap-3 hover:from-gray-200 hover:to-gray-300 focus:outline-none focus:ring-4 focus:ring-gray-300/50 transition-all duration-300 text-lg shadow-md hover:shadow-lg transform hover:-translate-y-1 border border-gray-300/50">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
          </svg>
          Kembali
        </button>
      </div>

    </div>
  </main>
</body>
</html>
